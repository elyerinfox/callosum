[workspace]
members = [
    "callosum-core",
    "callosum-kernels",
    "callosum-metal-kernels",
    "callosum-models",
    "callosum-nn",
    "callosum-ug",
    "callosum-wgpu",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "Pure-Rust tensor and inference engine: CPU, CUDA, and wgpu (Vulkan/DX12/Metal) backends."
repository = "https://github.com/elyerinfox/callosum"
keywords = ["tensor", "machine-learning", "wgpu", "cuda"]
categories = ["science"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
accelerate-src = { version = "0.3.2" }
anyhow = { version = "1", features = ["backtrace"] }
byteorder = "1.4.3"
callosum = { path = "./callosum-core", package = "callosum-core" }
callosum-kernels = { path = "./callosum-kernels" }
callosum-metal-kernels = { path = "./callosum-metal-kernels" }
callosum-models = { path = "./callosum-models" }
callosum-nn = { path = "./callosum-nn" }
callosum-ug = { path = "./callosum-ug" }
clap = { version = "4.2.4", features = ["derive"] }
criterion = { version = "0.8", default-features = false }
cudarc = { version = "0.19.8", features = [
    "std",
    "cublas",
    "cublaslt",
    "curand",
    "driver",
    "nvrtc",
    "f16",
    "f8",
    "cuda-version-from-build-system",
    "dynamic-linking",
], default-features = false }
fancy-regex = "0.17.0"
gemm = { version = "0.19.0", features = ["wasm-simd128-enable"] }
half = { version = "2.5.0", features = [
    "num-traits",
    "use-intrinsics",
    "rand_distr",
] }
float8 = { version = "0.7.0", features = ["num-traits", "rand_distr"] }
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"] }
libc = { version = "0.2.147" }
libm = { version = "0.2.15" }
log = "0.4"
memmap2 = { version = "0.9.3", features = ["stable_deref_trait"] }
num_cpus = "1.15.0"
num-traits = "0.2.15"
rand = "0.9.0"
rand_distr = "0.5.1"
rayon = "1.7.0"
safetensors = "0.7.0"
serde = { version = "1.0.171", features = ["derive"] }
serde_plain = "1.0.2"
serde_json = "1.0.99"
thiserror = "2"
tokenizers = { version = "0.22.0", default-features = false }
tracing = "0.1.37"
tracing-chrome = "0.7.1"
tracing-subscriber = "0.3.7"
ug = "0.5.0"
ug-cuda = "0.5.0"
ug-metal = "0.5.0"
yoke = { version = "0.8.1", features = ["derive"] }
zip = { version = "7.2.0", default-features = false }
objc2-metal = { version = "0.3.1" }
objc2-foundation = { version = "0.3.1" }

[profile.release-with-debug]
inherits = "release"
debug = true
